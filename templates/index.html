<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Sawm: fasting times, a live countdown and daily water guidance." />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}" />
  <title>Sawm</title>
</head>
<body>
  <header>
    <a class="brand" href="/" aria-label="Sawm home">
      <img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="28" height="28" />
      <span>Sawm</span>
    </a>
    <div class="actions">
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
      <button class="icon-btn" id="themeToggle" aria-label="Switch theme">
        <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <p class="place">{{ city }}, {{ country }}</p>

    <section class="timer" aria-label="Fasting countdown"
             data-suhoor="{{ suhoor }}" data-iftar="{{ iftar }}" data-tz="{{ timezone }}">
      <div class="ring">
        <svg viewBox="0 0 240 240" aria-hidden="true">
          <circle class="track" cx="120" cy="120" r="108" />
          <circle class="bar" id="bar" cx="120" cy="120" r="108" />
        </svg>
        <div class="ring-text">
          <p class="eyebrow" id="timerLabel">&nbsp;</p>
          <p class="countdown" id="countdown">--:--</p>
          <p class="sub" id="timerSub">&nbsp;</p>
        </div>
      </div>
      <dl class="times">
        <div><dt>Suhoor ends</dt><dd>{{ suhoor }}</dd></div>
        <div><dt>Iftar</dt><dd>{{ iftar }}</dd></div>
      </dl>
    </section>

    <section class="water" data-weather="{{ condition }}" aria-label="Water guidance">
      <div class="scene" aria-hidden="true"></div>
      <p class="eyebrow">Drink today</p>
      <p class="litres">{{ hydration }}<span> litres</span></p>
      <p class="note">Sip between Iftar and Suhoor rather than all at once.</p>
      <p class="conditions">{{ condition_text }} · {{ temp }}°C · {{ humidity }}% humidity</p>
    </section>
  </main>

  <div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-btn" id="closeSettings" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <label for="settingsLocation">Your city</label>
      <div class="row">
        <input type="text" id="settingsLocation" placeholder="City, Country" autocomplete="off" />
        <button class="icon-btn" id="geolocateBtn" aria-label="Use my location">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
        </button>
      </div>
      <label for="settingsMethod">Timing method</label>
      <select id="settingsMethod">
        <option value="2">ISNA (North America)</option>
        <option value="3">Muslim World League</option>
        <option value="1">University of Islamic Sciences, Karachi</option>
        <option value="4">Umm Al-Qura, Makkah</option>
        <option value="5">Egyptian General Authority</option>
        <option value="7">University of Tehran</option>
        <option value="8">Gulf Region</option>
        <option value="9">Kuwait</option>
        <option value="10">Qatar</option>
        <option value="11">MUIS, Singapore</option>
        <option value="12">UOIF, France</option>
        <option value="13">Diyanet, Turkey</option>
        <option value="15">Moonsighting Committee</option>
      </select>
      <button class="icon-btn save" id="updateLocationSettings" aria-label="Save settings">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
    </div>
  </div>

  <footer>
    <p>&copy; <span id="year"></span> Sawm · by
      <a href="https://github.com/rayyanarchy" target="_blank" rel="noopener noreferrer">@rayyanarchy</a> &amp;
      <a href="https://github.com/Saad-SYEDK" target="_blank" rel="noopener noreferrer">@Saad-SYEDK</a></p>
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
